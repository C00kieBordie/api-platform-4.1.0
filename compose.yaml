
services:
  # pwa:
  #   image: ${IMAGES_PREFIX:-}app-pwa
  #   build:
  #     context: ./pwa
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     NEXT_PUBLIC_ENTRYPOINT: http://localhost:8080

  mysql:
    image: 'mysql:5.7'
    ports:
      - "3306:3306"
    volumes:
      - 'mysql_data:/var/lib/mysql'
    environment:
      MYSQL_ROOT_PASSWORD: "password"
      MYSQL_DATABASE: "app"
    logging:
      options:
        max-size: 10m

  phpmyadmin:
    image: 'phpmyadmin/phpmyadmin:latest'
    container_name: phpmyadmin
    ports:
      - "82:80"
    environment:
      PMA_HOST: "mysql"
      PMA_PORT: "3306"
    mem_limit: 256M
    logging:
      options:
        max-size: 10m
    depends_on:
      - mysql

  php:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: frankenphp_dev
    ports:
      - "8080:80"
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://root:password@mysql:3306/app?serverVersion=5.7&charset=utf8mb4
      SERVER_NAME: ":80"
      CADDY_GLOBAL_OPTIONS: "local_certs"
    volumes:
      - ./api:/app
    depends_on:
      - mysql

volumes:
  mysql_data: