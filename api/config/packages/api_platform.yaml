api_platform:
    title: Hello API Platform
    version: 1.0.0
    docs_formats:
        jsonld: ['application/ld+json']
        html:   ['text/html']
    # Mercure integration, remove if unwanted
    mercure:
        include_type: true
    # Good defaults for REST APIs
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
